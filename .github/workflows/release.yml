name: Release (TestFlight & GitHub)

on:
  push:
    tags:
      - 'v*' # Tetikleyici: sadece v ile başlayan tag'lerde çalışır (örn: v1.0.0)

jobs:
  build-and-release:
    name: Build & Submit iOS and Android
    runs-on: ubuntu-latest
    
    # Tüm run komutlarının proje klasörü içinde çalışmasını sağlar
    defaults:
      run:
        working-directory: video-hub-mobile

    permissions:
      contents: write # GitHub Release oluşturmak için yetki

    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: video-hub-mobile/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run Tests
        run: npm test

      - name: ☕ Setup Java (For Android Local Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🍎 Build iOS on EAS & Auto-Submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive --wait

      - name: 📥 Download iOS Artifact from EAS
        run: |
          LATEST_BUILD_URL=$(eas build:list --platform ios --status finished --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          curl -L -o app-release.ipa "$LATEST_BUILD_URL"

      - name: 🤖 Build Android APK Locally
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\""
        run: eas build --platform android --profile github_release --local --non-interactive --output app-release.apk

      - name: 🏷 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # action-gh-release `working-directory` saymaz, bu yüzden dosya yolunu belirtiyoruz
          files: |
            video-hub-mobile/*.ipa
            video-hub-mobile/app-release.apk
          generate_release_notes: true
